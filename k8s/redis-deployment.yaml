apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  namespace: dreamcanvas
  labels:
    app: dreamcanvas-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dreamcanvas-redis
  template:
    metadata:
      labels:
        app: dreamcanvas-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 15
