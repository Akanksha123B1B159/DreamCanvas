apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-deployment
  namespace: dreamcanvas
  labels:
    app: dreamcanvas-ml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dreamcanvas-ml
  template:
    metadata:
      labels:
        app: dreamcanvas-ml
    spec:
      containers:
        - name: ml-service
          image: dreamcanvas-ml:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: LEGACY_ML_URL
              value: "https://job-posting-detection-api.onrender.com/predict"
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
