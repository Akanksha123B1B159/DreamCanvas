services:
  frontend:
    image: dreamcanvas-app:local
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set NEXT_PUBLIC_SUPABASE_URL in .env}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set NEXT_PUBLIC_SUPABASE_ANON_KEY in .env}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      JOB_DETECTION_URL: http://job-detection:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-10}
      HEARTBEAT_TIMEOUT: ${HEARTBEAT_TIMEOUT:-4}
      HEARTBEAT_FAILURE_THRESHOLD: ${HEARTBEAT_FAILURE_THRESHOLD:-2}
    depends_on:
      redis:
        condition: service_healthy
      job-detection:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker:
    image: dreamcanvas-app:local
    command: node worker/roadmap-worker.mjs
    environment:
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://frontend:3000
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-10}
      WORKER_HEARTBEAT_KEY: ${WORKER_HEARTBEAT_KEY:-dreamcanvas:health:worker}
    depends_on:
      redis:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

  job-detection:
    build: ./services/job-detection
    environment:
      LEGACY_ML_URL: ${LEGACY_ML_URL:-https://job-posting-detection-api.onrender.com/predict}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
